name: Python CI and Publish

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  verify-files-presence:
    name: verify-files-presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required files and directories
        run: |
          test -f requirements.txt || { echo "Missing requirements.txt"; exit 1; }
          test -f README.md || { echo "Missing README.md"; exit 1; }
          test -f pyproject.toml || { echo "Missing pyproject.toml"; exit 1; }
          test -d tests || { echo "Missing tests/ directory"; exit 1; }

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    needs:
      - verify-files-presence
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      # Advisory until the repo-wide format PR lands; remove continue-on-error to enforce.
      - name: Check formatting with ruff
        continue-on-error: true
        run: uv run --only-group dev ruff format --check --diff
      # Advisory until the lint baseline is clean; remove continue-on-error to enforce.
      - name: Lint with ruff
        continue-on-error: true
        run: uv run --only-group dev ruff check --output-format github

  ty:
    name: ty
    runs-on: ubuntu-latest
    needs:
      - verify-files-presence
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project and dev dependencies
        run: uv sync
      # Advisory until the type-check baseline is clean; remove continue-on-error to enforce.
      - name: Type check with ty
        continue-on-error: true
        run: uv run ty check --output-format github

  requirements-check:
    name: requirements-check
    runs-on: ubuntu-latest
    needs:
      - verify-files-presence
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install runtime dependencies
        run: uv sync --no-dev --no-install-project
      - name: Build installed package inventory
        run: |
          uv pip list --format=freeze \
            | cut -d'=' -f1 \
            | sed 's/-/_/g' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u > installed_packages.txt
          echo "Installed packages:"
          cat installed_packages.txt
      - name: Infer imports with pipreqs
        run: |
          uv run --no-dev --no-sync --with pipreqs --with urllib3==1.26.15 pipreqs . --force --encoding=utf-8 --ignore .venv,tests,examples --savepath requirements_from_imports.txt
          echo "Inferred imports from source code:"
          cat requirements_from_imports.txt
      - name: Compare imports with installed dependencies
        run: |
          grep -o '^[^=<>]*' requirements_from_imports.txt \
            | sed 's/-/_/g' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u > imported_packages.txt
          comm -23 imported_packages.txt installed_packages.txt > missing_packages.txt
          if [ -s missing_packages.txt ]; then
            echo "The following imports are not backed by installed dependencies:"
            cat missing_packages.txt
            exit 1
          fi

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs:
      - verify-files-presence
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Export pinned runtime dependencies
        run: uv export --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file requirements.audit.txt
      - name: Scan dependencies for known vulnerabilities
        run: uvx pip-audit -r requirements.audit.txt --disable-pip --no-deps

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    needs:
      - verify-files-presence
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Bandit security scan
        run: uvx bandit -r . --exclude "./.venv" -l -ii -s B404,B603

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs:
      - ruff
      - requirements-check
      - pip-audit
      - bandit
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: uv sync
      - name: Run test suite with coverage
        run: uv run pytest -v tests/ --cov --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  verify-version:
    name: verify-version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - verify-files-presence
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check pyproject.toml version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -Po '(?<=^version = ")[^"]+' pyproject.toml)
          echo "Git tag version : $TAG"
          echo "pyproject version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Version mismatch: tag=$TAG pyproject=$PKG_VERSION"
            exit 1
          fi

  release-build:
    name: release-build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - pytest
      - verify-version
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build source and wheel distributions
        run: |
          uv build
          uvx twine check dist/*
      - name: Upload release distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/
          retention-days: 7

  verify-wheel:
    name: verify-wheel
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - release-build
    timeout-minutes: 10
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install from wheel and smoke test
        run: |
          WHL=$(ls dist/*.whl | head -1)
          uv run --no-project --with "./$WHL" python - <<'PY'
          import kvbiii_ml
          print(kvbiii_ml.__version__)
          print("Smoke test passed!")
          PY

  pypi-publish:
    name: pypi-publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - release-build
      - verify-wheel
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/kvbiii-ml
    timeout-minutes: 10
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/
      - name: Publish distributions to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
